# fly.toml for the tourney-api service. Generated by `fly launch`,
# then re-annotated: everything below is a deliberate choice, not a default.
#
# Region: Singapore, close to the Indonesian audience. The Supabase project is
# ALSO in Singapore (ap-southeast-1) since the 2026-09-06 cutover, so app and
# database sit in one region and a DB round-trip is ~4ms (it was ~90ms while
# the database lived in Sydney). Keep them co-located: this app makes several
# DB calls per request but only one trip to the viewer, so splitting the two
# across regions costs far more than it looks.

app = 'tourney-api'
primary_region = 'sin'

[build]

# Migrations run in a one-off machine before the new release takes traffic.
# Reads MIGRATION_DATABASE_URL (Supabase session pooler, 5432) — set it as a
# secret BEFORE the first deploy or this command fails the release.
[deploy]
  release_command = '/app/migrate up'

[env]
  APP_ENV = 'production'
  LOG_LEVEL = 'info'
  PORT = '8080'
  # PER MACHINE, against Supabase Free's connection budget — raise deliberately.
  DB_MAX_CONNS = '8'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # The public pages hold an open SSE stream, so a spectator should never wait
  # on a cold start. NOTE: this is a floor, not a ceiling — the realtime hub is
  # in-process, so a SECOND machine would silently split live updates. Deploy
  # with --ha=false and keep the count at 1 until Redis pub/sub exists.
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  cpus = 1
  memory = '256mb'
